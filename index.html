  <body>
    <script>
      (function () {
        var key = 'spa_redirect_path';
        var redirectPath = null;
        try {
          redirectPath = sessionStorage.getItem(key);
          if (redirectPath) sessionStorage.removeItem(key);
        } catch (_error) {}

        if (!redirectPath) return;
        if (!redirectPath.startsWith('/')) redirectPath = '/' + redirectPath;
        window.history.replaceState(null, '', redirectPath);
      })();
    </script>
