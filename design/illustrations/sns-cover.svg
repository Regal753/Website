<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <!-- YouTube・SNS運用：動画プレイヤー、縦型動画、推移と予定 -->
  <rect width="900" height="600" fill="#f3efe1"/>
  <circle cx="450" cy="290" r="220" fill="#e4e9e6"/>
  <circle cx="180" cy="400" r="110" fill="#e8e4d2"/>

  <path d="M90 300 C 160 250, 220 280, 270 300 M630 330 C 690 360, 760 340, 820 290"
