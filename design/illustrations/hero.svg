    <path d="M750 405 C 722 362, 690 372, 708 398 C 716 408, 736 408, 750 405 Z" fill="#f1dcb5" stroke="#163d58"/>
    <path d="M750 405 C 778 362, 810 372, 792 398 C 784 408, 764 408, 750 405 Z" fill="#f1dcb5" stroke="#163d58"/>
    <rect x="672" y="405" width="156" height="34" rx="5" fill="#fffdf4"/>
    <rect x="682" y="439" width="136" height="96" rx="3" fill="#fffdf4"/>
    <rect x="741" y="405" width="18" height="130" fill="#c98a3c" stroke="none"/>
    <rect x="672" y="405" width="156" height="34" rx="5"/>
    <rect x="682" y="439" width="136" height="96" rx="3"/>
    <!-- きらめき -->
    <path d="M848 380 V400 M838 390 H858 M640 470 V484 M633 477 H647" stroke="#c98a3c" stroke-width="2.5"/>
  </g>
</svg>
