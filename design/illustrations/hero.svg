  <circle cx="190" cy="230" r="150" fill="#e8e4d2"/>
  <circle cx="660" cy="200" r="170" fill="#e4e9e6"/>
  <circle cx="760" cy="470" r="110" fill="#ece2cc"/>

  <!-- リボン（背面） -->
