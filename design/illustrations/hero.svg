    <path d="M154 184 V160 M184 176 V152 M214 188 V164 M244 172 V148 M184 152 L244 148" stroke-width="2"/>
    <path d="M156 242 V218 M196 234 V210 M236 250 V226 M166 300 V276 M221 292 V268" stroke-width="2"/>

    <!-- 2. 権利情報：台帳 -->
    <rect x="330" y="300" width="200" height="210" rx="10" fill="#fffdf4"/>
    <rect x="398" y="288" width="64" height="24" rx="6" fill="#e1e2d2"/>
    <g stroke="#c98a3c" stroke-width="3">
      <circle cx="360" cy="350" r="10"/><path d="M355 350 L359 354 L366 346"/>
      <circle cx="360" cy="395" r="10"/><path d="M355 395 L359 399 L366 391"/>
      <circle cx="360" cy="440" r="10"/><path d="M355 440 L359 444 L366 436"/>
    </g>
    <circle cx="360" cy="485" r="10" stroke="#93b3bd"/>
    <path d="M384 346 H505 M384 391 H490 M384 436 H500 M384 481 H470"/>
    <path d="M384 358 H450 M384 403 H462 M384 448 H440 M384 493 H430" stroke="#93b3bd" stroke-width="2.5"/>

