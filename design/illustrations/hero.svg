        fill="none" stroke="#c98a3c" stroke-width="6" stroke-linecap="round"/>
  <g fill="#c98a3c">
    <circle cx="300" cy="392" r="5"/>
    <circle cx="540" cy="330" r="5"/>
  </g>

  <g fill="none" stroke="#163d58" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
