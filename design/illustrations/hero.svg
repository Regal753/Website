    </g>
    <g fill="#163d58" stroke="none">
      <ellipse cx="148" cy="184" rx="6" ry="4.5"/><ellipse cx="178" cy="176" rx="6" ry="4.5"/>
      <ellipse cx="208" cy="188" rx="6" ry="4.5"/><ellipse cx="238" cy="172" rx="6" ry="4.5"/>
      <ellipse cx="150" cy="242" rx="6" ry="4.5"/><ellipse cx="190" cy="234" rx="6" ry="4.5"/>
      <ellipse cx="230" cy="250" rx="6" ry="4.5"/>
      <ellipse cx="160" cy="300" rx="6" ry="4.5"/><ellipse cx="215" cy="292" rx="6" ry="4.5"/>
