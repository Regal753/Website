    <path d="M540 118 H790"/>
    <g fill="#93b3bd" stroke="none"><circle cx="558" cy="104" r="4"/><circle cx="572" cy="104" r="4"/><circle cx="586" cy="104" r="4"/></g>
    <rect x="558" y="132" width="214" height="94" rx="6" fill="#dce7e9" stroke="none"/>
    <circle cx="665" cy="179" r="22" fill="#163d58" stroke="none"/>
    <path d="M658 168 L676 179 L658 190 Z" fill="#fffdf4" stroke="none"/>
