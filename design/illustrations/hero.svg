    <rect x="570" y="305" width="120" height="76" rx="8" fill="#fffdf4"/>
    <path d="M584 364 L610 346 L632 354 L674 322" stroke="#c98a3c"/>
    <path d="M584 371 H676" stroke="#c9c3b3" stroke-width="2"/>

